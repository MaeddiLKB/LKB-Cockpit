<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LKB Live Cockpit</title>
    <style>
        /* ==========================================================================
           DESIGN SYSTEM (LKB IDENTITY - HKS 64 K BAND GREEN)
           ========================================================================== */
        :root {
            --bg: #050705;
            --surface: #0e120f;
            --surface-card: #141a15;
            --surface-elevated: #1b231d;
            --primary: #00d643;
            --primary-dim: #00962c;
            --primary-glow: rgba(0, 214, 67, 0.18);
            --danger: #ff2a2a;
            --danger-bg: #220909;
            --danger-border: #591616;
            --warning: #ffb700;
            --warning-bg: rgba(255, 183, 0, 0.14);
            --text: #f5f8f6;
            --text-dim: #8fa093;
            --border: #222c24;
            --border-highlight: #314234;
            --watermark-opacity: 0.03;
        }

        body.practice-mode {
            --bg: #eef2ee;
            --surface: #ffffff;
            --surface-card: #f5f8f5;
            --surface-elevated: #e6ece7;
            --primary: #008726;
            --primary-dim: #006b1e;
            --primary-glow: rgba(0, 135, 38, 0.10);
            --danger: #d91414;
            --danger-bg: #fff0f0;
            --danger-border: #fca5a5;
            --warning: #b86200;
            --warning-bg: rgba(184, 98, 0, 0.12);
            --text: #0f1410;
            --text-dim: #546357;
            --border: #cdd8ce;
            --border-highlight: #b0c2b2;
            --watermark-opacity: 0.04;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        /* ==========================================================================
           SPLASH SCREEN (3 SEKUNDEN START-LOGO MIT SOFORT-BYPASS)
           ========================================================================== */
        #lkb-splash {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #0f1c12 0%, #050705 75%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            cursor: pointer;
            transition: opacity 0.45s ease, visibility 0.45s ease;
        }
        #lkb-splash.splash-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .splash-logo-wrap {
            width: min(74vw, 310px);
            height: min(74vw, 310px);
            display: flex;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(0 0 28px rgba(0, 214, 67, 0.28));
            animation: splashPop 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .splash-logo-wrap svg {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .splash-hint {
            margin-top: 22px;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-dim);
            opacity: 0.7;
        }
        @keyframes splashPop {
            0% { transform: scale(0.86); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* ==========================================================================
           AUTO-HIDE TOP SECTION (HEADER + NAV BIS ZUR GRÜNEN LINIE)
           ========================================================================== */
        #top-collapsible {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-height: 140px;
            opacity: 1;
            overflow: hidden;
            transform: translateY(0);
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.35s ease,
                        transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 30;
        }

        body:not(.practice-mode) #top-collapsible.hidden-top {
            max-height: 0 !important;
            opacity: 0;
            transform: translateY(-100%);
            pointer-events: none;
        }

        /* 1. KOPFLEISTE */
        header {
            background: var(--surface);
            border-bottom: 2px solid var(--border);
            padding: 6px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }
        .header-group { display: flex; align-items: center; gap: 6px; }

        .btn-tool {
            background: var(--surface-elevated);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }
        .btn-tool:active { transform: scale(0.97); }
        .btn-tool.active-mode {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
            font-weight: 900;
        }

        /* 2. GIG-NAVIGATION BIS ZUR GRÜNEN LINIE */
        #cockpit-nav {
            background: var(--surface);
            border-bottom: 2px solid var(--primary);
            padding: 5px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .btn-nav {
            background: var(--surface-card);
            color: var(--text);
            border: 2px solid var(--border-highlight);
            padding: 9px 16px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 900;
            cursor: pointer;
            flex: 1;
            max-width: 190px;
            text-align: center;
            user-select: none;
        }
        body.practice-mode .btn-nav {
            padding: 6px 12px;
            font-size: 0.88rem;
            border-width: 1px;
        }
        .btn-nav:active:not(:disabled) {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
        }
        .btn-nav:disabled { opacity: 0.25; cursor: not-allowed; }
        .nav-center-box { text-align: center; }
        .nav-counter { font-size: 1.15rem; font-weight: 900; color: var(--primary); line-height: 1; }
        .nav-block-label {
            font-size: 0.65rem;
            font-weight: 800;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-top: 2px;
        }

        /* ==========================================================================
           WORKSPACE & SIDEBAR DRAWER
           ========================================================================== */
        #workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        #sidebar {
            width: 340px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 40;
            box-shadow: 4px 0 20px rgba(0,0,0,0.4);
        }
        #sidebar.hidden { display: none; }

        .sidebar-controls {
            padding: 10px;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: var(--surface-card);
        }
        input, select {
            width: 100%;
            padding: 8px 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        input:focus, select:focus {
            outline: 2px solid var(--primary);
            border-color: var(--primary);
        }

        #song-list { flex: 1; overflow-y: auto; list-style: none; }
        .song-item {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }
        .song-item:hover, .song-item.active {
            background: var(--primary-glow);
            border-left: 4px solid var(--primary);
        }
        .song-title-text {
            font-weight: 700;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text);
        }
        .song-sub-text { color: var(--text-dim); font-size: 0.8rem; }
        .badge-pos {
            background: var(--primary);
            color: #000;
            font-weight: 900;
            font-size: 0.75rem;
            padding: 1px 5px;
            border-radius: 4px;
            min-width: 20px;
            text-align: center;
        }
        .badge-tuning {
            background: var(--surface-elevated);
            border: 1px solid var(--border);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--primary);
            white-space: nowrap;
        }
        .dot-status { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
        .dot-Grün { background: #00d643; }
        .dot-Gelb { background: #ffb700; }
        .dot-Rot { background: #ff2a2a; }

        /* ==========================================================================
           MAIN COCKPIT
           ========================================================================== */
        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            min-width: 0;
        }

        .lkb-watermark {
            position: absolute;
            right: -40px;
            bottom: 20px;
            width: 320px;
            height: 320px;
            opacity: var(--watermark-opacity);
            pointer-events: none;
            z-index: 0;
        }

        #song-content {
            flex: 1;
            padding: 8px 12px;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 2;
        }

        .header-title-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 4px;
            flex-wrap: wrap;
            cursor: pointer;
            user-select: none;
        }
        .song-title-heading {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.65rem;
            font-weight: 900;
            line-height: 1.1;
            color: var(--text);
        }
        .song-artist-heading {
            color: var(--primary);
            font-size: 0.88rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        /* ==========================================================================
           ÜBE-MODUS TOOLBAR & STIMMGERÄT
           ========================================================================== */
        #practice-dashboard {
            background: var(--surface);
            border: 1.5px solid var(--primary);
            border-radius: 8px;
            padding: 8px 10px;
            display: none;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        body.practice-mode #practice-dashboard { display: flex; }

        .metro-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }
        .btn-metro-pill {
            background: var(--primary);
            color: #ffffff;
            border: none;
            padding: 7px 12px;
            border-radius: 6px;
            font-size: 0.92rem;
            font-weight: 900;
            cursor: pointer;
            white-space: nowrap;
            min-width: 115px;
            text-align: center;
            transition: all 0.08s ease;
        }
        .btn-metro-pill.playing {
            background: #111713;
            color: #00ff4c;
        }
        .btn-metro-pill.pulse {
            background: #ffaa00 !important;
            color: #000000 !important;
            transform: scale(1.04);
        }

        .metro-step-group { display: flex; align-items: center; gap: 4px; }
        .btn-tempo-step {
            background: var(--surface-elevated);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 7px 9px;
            border-radius: 5px;
            font-size: 0.8rem;
            font-weight: 800;
            cursor: pointer;
            line-height: 1;
        }
        .btn-tempo-step:active { background: var(--primary); color: #fff; }
        .btn-tempo-reset {
            background: var(--surface-card);
            color: var(--text-dim);
            border: 1px solid var(--border);
            padding: 7px 8px;
            border-radius: 5px;
            font-size: 0.78rem;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
        }

        .metro-slider-row {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface-card);
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        .slider-bound-label { font-size: 0.7rem; font-weight: 800; color: var(--text-dim); }
        .slider-tempo-full {
            flex: 1;
            width: 100%;
            height: 8px;
            border-radius: 4px;
            accent-color: var(--primary);
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            background: var(--surface-elevated);
        }
        .slider-tempo-full::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--primary);
            border: 2px solid #ffffff;
            box-shadow: 0 1px 4px rgba(0,0,0,0.3);
            cursor: pointer;
        }

        .practice-tools-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            flex-wrap: wrap;
        }
        .select-tool-pill {
            background: var(--surface-card);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 5px 8px;
            font-size: 0.82rem;
            font-weight: 800;
            cursor: pointer;
            width: auto;
        }
        .audio-links-compact { display: flex; align-items: center; gap: 5px; }
        .btn-audio-pill {
            border: 1px solid var(--border);
            padding: 5px 9px;
            border-radius: 5px;
            font-size: 0.78rem;
            font-weight: 800;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        /* STIMMGERÄT (IN ÜBE-MODUS) */
        #tuner-container {
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 10px;
            margin-top: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .tuner-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            font-size: 0.75rem;
            font-weight: 800;
        }
        .tuner-note {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--primary);
            text-align: center;
            line-height: 1;
        }
        .tuner-meter {
            position: relative;
            width: 100%;
            height: 10px;
            background: var(--surface-elevated);
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .tuner-needle {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--danger);
            left: 50%;
            transform: translateX(-50%);
            transition: left 0.05s linear;
        }
        .tuner-needle.in-tune { background: var(--primary); }

        /* ==========================================================================
           PRE-SONG TELEMETRIE (GIG HUD)
           ========================================================================== */
        .stage-hud {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 72px;
            gap: 6px;
            width: 100%;
        }

        .hud-card {
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-radius: 7px;
            padding: 6px 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 0;
        }

        .hud-label {
            font-size: 0.62rem;
            font-weight: 900;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.7px;
            margin-bottom: 2px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hud-value-select {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--primary);
            font-size: 1.08rem;
            font-weight: 900;
            cursor: pointer;
            padding: 0;
            text-overflow: ellipsis;
        }

        .hud-card.kapo-hud {
            text-align: center;
            align-items: center;
            padding: 6px 4px;
            border-width: 2px;
        }
        .hud-card.kapo-hud.has-kapo {
            border-color: var(--warning);
            background: var(--warning-bg);
            box-shadow: 0 0 10px rgba(255, 183, 0, 0.25);
        }
        .kapo-value-select {
            text-align: center;
            text-align-last: center;
            font-size: 1.25rem;
            font-weight: 900;
            color: var(--text-dim);
        }
        .hud-card.kapo-hud.has-kapo .kapo-value-select { color: var(--warning); }

        .hud-card.rig-hud {
            grid-column: 1 / -1;
            padding: 8px 12px;
            background: var(--surface-card);
            border-left: 4px solid var(--primary);
            cursor: pointer;
        }
        .rig-value-display {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--text);
            white-space: normal;
            overflow-wrap: anywhere;
            word-break: break-word;
            line-height: 1.35;
        }

        .hud-card.transition-hud {
            grid-column: 1 / -1;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            padding: 5px 10px;
            gap: 10px;
        }
        .hud-card.transition-hud .hud-label { margin-bottom: 0; white-space: nowrap; flex-shrink: 0; }
        .transition-select { color: var(--text); font-size: 0.92rem; font-weight: 700; text-align: right; text-align-last: right; }

        /* ==========================================================================
           CUES & AKKORDE
           ========================================================================== */
        .cue-banner {
            background: var(--danger-bg);
            border-left: 5px solid var(--danger);
            border-top: 1px solid var(--danger-border);
            border-right: 1px solid var(--danger-border);
            border-bottom: 1px solid var(--danger-border);
            border-radius: 7px;
            padding: 8px 12px;
        }
        .cue-banner-title {
            color: var(--danger);
            font-size: 0.68rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 2px;
        }
        .cue-banner-text {
            color: #ffe6e6;
            font-size: 1.05rem;
            font-weight: 800;
            line-height: 1.35;
            overflow-wrap: anywhere;
        }
        body.practice-mode .cue-banner { display: none; }

        .chords-container {
            flex: 1;
            background: var(--surface-card);
            border: 1px solid var(--border);
            border-left: 4px solid var(--primary);
            border-radius: 7px;
            padding: 12px 14px;
            min-width: 0;
        }
        .chords-header {
            color: var(--primary);
            font-size: 0.7rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        pre.chords-content {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 1.12rem;
            font-weight: 700;
            line-height: 1.55;
            color: var(--text);
        }

        /* ==========================================================================
           NÄCHSTER SONG WARNER (GRÜN BEI WECHSEL, OHNE ÜBERGANGS-TEXT)
           ========================================================================== */
        #next-song-banner {
            background: var(--surface);
            border-top: 2px solid var(--border);
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            font-weight: 800;
            flex-wrap: wrap;
            z-index: 10;
            transition: background 0.2s ease, color 0.2s ease;
        }
        body.practice-mode #next-song-banner { display: none; }

        /* Wenn Wechsel ansteht: Grüne Hervorhebung statt Rot */
        #next-song-banner.warning-alert {
            background: var(--primary);
            color: #000000;
            border-top: 2px solid #ffffff;
            box-shadow: 0 -2px 12px rgba(0, 214, 67, 0.35);
        }
        #next-song-banner.warning-alert span {
            color: #000000 !important;
            font-weight: 900;
        }

        .footer-microbar {
            background: var(--bg);
            padding: 2px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.6rem;
            color: var(--text-dim);
            border-top: 1px solid var(--border);
            z-index: 5;
        }

        /* MODAL */
        #sync-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 100;
        }
        .modal-card {
            background: var(--surface);
            color: var(--text);
            border: 2px solid var(--primary);
            border-radius: 10px;
            max-width: 520px;
            width: 100%;
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        @media (max-width: 768px) {
            #sidebar { position: absolute; inset: 0; width: 100%; }
            .song-title-heading { font-size: 1.45rem; }
        }
    </style>
</head>
<body>

    <!-- START-SPLASH-SCREEN -->
    <div id="lkb-splash" onclick="dismissSplash()" title="Tippen zum Überspringen">
        <div class="splash-logo-wrap">
            <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <path id="textArcTop" d="M 52,200 A 148,148 0 1,1 348,200" />
                    <path id="textArcBottom" d="M 356,200 A 156,156 0 0,1 44,200" />
                </defs>
                <circle cx="200" cy="200" r="186" fill="none" stroke="#00d643" stroke-width="4" opacity="0.95"/>
                <circle cx="200" cy="200" r="176" fill="none" stroke="#00d643" stroke-width="2" opacity="0.95"/>
                <text fill="#00d643" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="900" letter-spacing="3">
                    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">LA KAWA BANDA</textPath>
                </text>
                <text fill="#00d643" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="900" letter-spacing="2.5">
                    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">MODERN COVERROCK</textPath>
