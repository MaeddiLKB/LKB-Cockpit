<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LKB Live Cockpit</title>
    <style>
        /* ==========================================================================
           DESIGN SYSTEM (LKB IDENTITY - HKS 64 K BAND GREEN)
           ========================================================================== */
        :root {
            --bg: #050705;
            --surface: #0e120f;
            --surface-card: #141a15;
            --surface-elevated: #1b231d;
            --primary: #00d643;
            --primary-dim: #00962c;
            --primary-glow: rgba(0, 214, 67, 0.18);
            --danger: #ff2a2a;
            --danger-bg: #220909;
            --danger-border: #591616;
            --warning: #ffb700;
            --warning-bg: rgba(255, 183, 0, 0.14);
            --text: #f5f8f6;
            --text-dim: #8fa093;
            --border: #222c24;
            --border-highlight: #314234;
            --watermark-opacity: 0.03;
        }

        body.practice-mode {
            --bg: #eef2ee;
            --surface: #ffffff;
            --surface-card: #f5f8f5;
            --surface-elevated: #e6ece7;
            --primary: #008726;
            --primary-dim: #006b1e;
            --primary-glow: rgba(0, 135, 38, 0.10);
            --danger: #d91414;
            --danger-bg: #fff0f0;
            --danger-border: #fca5a5;
            --warning: #b86200;
            --warning-bg: rgba(184, 98, 0, 0.12);
            --text: #0f1410;
            --text-dim: #546357;
            --border: #cdd8ce;
            --border-highlight: #b0c2b2;
            --watermark-opacity: 0.04;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        /* ==========================================================================
           SPLASH SCREEN (3 SEKUNDEN START-LOGO MIT SOFORT-BYPASS)
           ========================================================================== */
        #lkb-splash {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #0f1c12 0%, #050705 75%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            cursor: pointer;
            transition: opacity 0.45s ease, visibility 0.45s ease;
        }
        #lkb-splash.splash-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .splash-logo-wrap {
            width: min(74vw, 310px);
            height: min(74vw, 310px);
            display: flex;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(0 0 28px rgba(0, 214, 67, 0.28));
            animation: splashPop 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .splash-logo-wrap svg {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .splash-hint {
            margin-top: 22px;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-dim);
            opacity: 0.7;
        }
        @keyframes splashPop {
            0% { transform: scale(0.86); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* ==========================================================================
           AUTO-HIDE TOP SECTION (HEADER + NAV BIS ZUR GRÜNEN LINIE)
           ========================================================================== */
        #top-collapsible {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-height: 140px;
            opacity: 1;
            overflow: hidden;
            transform: translateY(0);
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.35s ease,
                        transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 30;
        }

        body:not(.practice-mode) #top-collapsible.hidden-top {
            max-height: 0 !important;
            opacity: 0;
            transform: translateY(-100%);
            pointer-events: none;
        }

        /* 1. KOPFLEISTE */
        header {
            background: var(--surface);
            border-bottom: 2px solid var(--border);
            padding: 6px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }
        .header-group { display: flex; align-items: center; gap: 6px; }

        .btn-tool {
            background: var(--surface-elevated);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }
        .btn-tool:active { transform: scale(0.97); }
        .btn-tool.active-mode {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
            font-weight: 900;
        }

        /* 2. GIG-NAVIGATION BIS ZUR GRÜNEN LINIE */
        #cockpit-nav {
            background: var(--surface);
            border-bottom: 2px solid var(--primary);
            padding: 5px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .btn-nav {
            background: var(--surface-card);
            color: var(--text);
            border: 2px solid var(--border-highlight);
            padding: 9px 16px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 900;
            cursor: pointer;
            flex: 1;
            max-width: 190px;
            text-align: center;
            user-select: none;
        }
        body.practice-mode .btn-nav {
            padding: 6px 12px;
            font-size: 0.88rem;
            border-width: 1px;
        }
        .btn-nav:active:not(:disabled) {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
        }
        .btn-nav:disabled { opacity: 0.25; cursor: not-allowed; }
        .nav-center-box { text-align: center; }
        .nav-counter { font-size: 1.15rem; font-weight: 900; color: var(--primary); line-height: 1; }
        .nav-block-label {
            font-size: 0.65rem;
            font-weight: 800;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-top: 2px;
        }

        /* ==========================================================================
           WORKSPACE & SIDEBAR DRAWER
           ========================================================================== */
        #workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        #sidebar {
            width: 340px;
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 40;
            box-shadow: 4px 0 20px rgba(0,0,0,0.4);
        }
        #sidebar.hidden { display: none; }

        .sidebar-controls {
            padding: 10px;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: var(--surface-card);
        }
        input, select {
            width: 100%;
            padding: 8px 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        input:focus, select:focus {
            outline: 2px solid var(--primary);
            border-color: var(--primary);
        }

        #song-list { flex: 1; overflow-y: auto; list-style: none; }
        .song-item {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }
        .song-item:hover, .song-item.active {
            background: var(--primary-glow);
            border-left: 4px solid var(--primary);
        }
        .song-title-text {
            font-weight: 700;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text);
        }
        .song-sub-text { color: var(--text-dim); font-size: 0.8rem; }
        .badge-pos {
            background: var(--primary);
            color: #000;
            font-weight: 900;
            font-size: 0.75rem;
            padding: 1px 5px;
            border-radius: 4px;
            min-width: 20px;
            text-align: center;
        }
        .badge-tuning {
            background: var(--surface-elevated);
            border: 1px solid var(--border);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--primary);
            white-space: nowrap;
        }
        .dot-status { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
        .dot-Grün { background: #00d643; }
        .dot-Gelb { background: #ffb700; }
        .dot-Rot { background: #ff2a2a; }

        /* ==========================================================================
           MAIN COCKPIT
           ========================================================================== */
        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            min-width: 0;
        }

        .lkb-watermark {
            position: absolute;
            right: -40px;
            bottom: 20px;
            width: 320px;
            height: 320px;
            opacity: var(--watermark-opacity);
            pointer-events: none;
            z-index: 0;
        }

        #song-content {
            flex: 1;
            padding: 8px 12px;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 2;
        }

        .header-title-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px;
            border-bottom: 1px solid var(--border);
            padding-bottom
